{% extends "shop/base.html" %}
{% block content %}
<div class="product-list" style="float:none; max-width:500px; margin:40px auto;">
    <h2>{{ action }} Product Listing</h2>
    <hr style="border:0; border-top:1px solid #efefef; margin-bottom:20px;">

 
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        {% if form.errors %}
            <div style="background:#fff3f3; border-left:4px solid #dc1616; padding:10px; margin-bottom:20px;">
                {{ form.errors }}
            </div>
        {% endif %}

 
        {% for field in form %}
            <p style="overflow:auto; margin-bottom:15px; width:100%;">
                <label style="display:block; margin-bottom:5px; font-weight:bold; font-size:14px;">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}
                    <small style="color:#888; display:block; margin-top:2px;">{{ field.help_text }}</small>
                {% endif %}
            </p>
        {% endfor %}

        <div style="margin-top:30px; overflow:auto;">
            <input type="submit" value="Save Product Data" style="float:left; cursor:pointer;">
            <a href="{% url 'shop:seller_dashboard' %}" class="button light" style="float:right;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
